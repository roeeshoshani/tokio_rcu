[package]
name = "tokio_rcu"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "RCU (read-copy-update) for async rust with tokio"
readme = "README.md"
repository = "https://github.com/roeeshoshani/tokio_rcu"
keywords = ["rcu", "async", "tokio"]
categories = ["concurrency", "algorithms", "asynchronous", "data-structures", "memory-management"]

[dependencies]
branches = { version = "0.5.0", default-features = false }
index_type = "0.7.1"
num_cpus = "1.17.0"
parking_lot = "0.12.5"
tokio = { version = "1.53.1", features = ["sync", "rt", "rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
arc-swap = "1.9.2"
divan = "0.1.21"
tokio = { version = "1.53.1", features = ["full"] }

[features]
# a feature flag which when enabled, makes the epoch id smaller.
# this is mainly used for testing, since using a small epoch id makes it easier to overflow it in a reasonable time.
# this is used to check that the code for dealing with the overflow of the epoch id works properly.
small_epoch_id = []

[[bench]]
name = "comparison"
harness = false
