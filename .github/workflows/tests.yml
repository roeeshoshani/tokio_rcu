name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_ALL_FEATURES_VERSION: "1.12.0"
  CARGO_NEXTEST_VERSION: "0.9.143"
  CARGO_RDME_VERSION: "2.2.2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: --cfg tokio_unstable -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-all-features
          locked: true
          version: ${{ env.CARGO_ALL_FEATURES_VERSION }}

      - run: cargo all-features check --all-targets

  tests-release-mode:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-nextest
          locked: true
          version: ${{ env.CARGO_NEXTEST_VERSION }}

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-all-features
          locked: true
          version: ${{ env.CARGO_ALL_FEATURES_VERSION }}

      - run: cargo all-features nextest run --release
      - run: cargo all-features test --doc --release

  tests-debug-mode:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-nextest
          locked: true
          version: ${{ env.CARGO_NEXTEST_VERSION }}

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-all-features
          locked: true
          version: ${{ env.CARGO_ALL_FEATURES_VERSION }}

      - run: cargo all-features nextest run
      - run: cargo all-features test --doc

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-all-features
          locked: true
          version: ${{ env.CARGO_ALL_FEATURES_VERSION }}

      - run: cargo all-features clippy --all-targets -- -D warnings

  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-rdme
          locked: true
          version: ${{ env.CARGO_RDME_VERSION }}

      - run: cargo rdme install-rust-toolchain-for-intralinks
      - run: cargo rdme --check

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: --cfg tokio_unstable -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-all-features
          locked: true
          version: ${{ env.CARGO_ALL_FEATURES_VERSION }}

      - run: cargo all-features doc --no-deps

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.49.0
